spring.application.name=parkingmanager
spring.datasource.url=jdbc:postgresql://localhost:5433/parkingmanager
spring.datasource.username=postgres
spring.datasource.password=parking123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Houston Time
app.time-zone=America/Chicago

# First Super Admins Credentials (env vars)
app.first-admin.email=${FIRST_ADMIN_EMAIL:}
app.first-admin.password=${FIRST_ADMIN_PASSWORD:}

# Security configs
# secure=true (send the cookie over HTTPS only) has to wait for production.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.servlet.context-path=/api