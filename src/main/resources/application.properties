spring.application.name=parkingmanager
spring.datasource.url=jdbc:postgresql://localhost:5433/parkingmanager
spring.datasource.username=postgres
spring.datasource.password=parking123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Houston Time
app.time-zone=America/Chicago

# First Super Admins Credentials (env vars)
app.first-admin.email=${FIRST_ADMIN_EMAIL:}
app.first-admin.password=${FIRST_ADMIN_PASSWORD:}

# Security configs
# http-only: JavaScript can?t read the session cookie, so a malicious script injected into the page can?t steal it.
# same-site=lax: the browser doesn?t send the cookie on POSTs that come from other sites. It?s a second layer of protection on top of CSRF.
# secure=true (send the cookie over HTTPS only) has to wait for production.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax